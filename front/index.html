```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed CRUD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Distribuídos OS
        </div>

        <ul class="nav-links">

            <li>
                <a href="#"
                   onclick="alternarTela('tela-login')">
                    Login
                </a>
            </li>

            <li>
                <a href="#"
                   onclick="alternarTela('tela-cadastro')">
                    Cadastrar Usuário
                </a>
            </li>

            <li>
                <a href="#"
                   onclick="alternarTela('tela-listagem')">
                    Visualizar Banco
                </a>
            </li>

        </ul>

    </nav>


    <div class="container">


        <!-- LOGIN -->

        <section id="tela-login" class="modulo-tela">

            <h2>🔐 Login Distribuído</h2>

            <form id="formLogin">

                <div class="form-group">

                    <label>Email:</label>

                    <input
                        type="email"
                        id="loginEmail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Senha:</label>

                    <input
                        type="password"
                        id="loginSenha"
                        required
                    >

                </div>


                <button type="submit" class="btn">
                    Entrar
                </button>

            </form>

        </section>


        <!-- CADASTRO -->

        <section id="tela-cadastro"
                 class="modulo-tela deactive">

            <h2>
                👤 Cadastro de Usuário
            </h2>

            <form id="formCadastro">


                <div class="form-group">

                    <label for="nome">
                        Nome Completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                        placeholder="Ex: Rian Souza"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="Ex: rian@gmail.com"
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha:
                    </label>

                    <input
                        type="password"
                        id="senha"
                        required
                        placeholder="Digite uma senha"
                    >

                </div>


                <button
                    type="submit"
                    class="btn">

                    Enviar para a Rede

                </button>

            </form>

        </section>


        <!-- LISTAGEM -->

        <section id="tela-listagem"
                 class="modulo-tela deactive">

            <h2>
                🗄️ Dados Persistidos
            </h2>

            <button
                id="btnAtualizar"
                class="btn secundario">

                Atualizar Lista

            </button>


            <table id="tabelaUsuarios">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Data Registro</th>
                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
