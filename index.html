<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Distributed CRUD
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <!-- ===================================== -->
  <!-- LOGIN / CADASTRO -->
  <!-- ===================================== -->

  <div
    class="login-container"
    id="loginScreen"
  >

    <div class="login-box">

      <h2>
        🔐 Sistema Distribuído
      </h2>

      <input
        type="text"
        id="usuario"
        placeholder="Digite seu usuário"
      />

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
      />

      <div class="login-buttons">

        <button
          class="btn"
          onclick="fazerLogin()"
        >
          Entrar
        </button>

        <button
          class="btn secundario"
          onclick="cadastrarConta()"
        >
          Criar Conta
        </button>

      </div>

      <p id="erroLogin"></p>

    </div>

  </div>


  <!-- ===================================== -->
  <!-- SISTEMA -->
  <!-- ===================================== -->

  <div
    id="sistema"
    style="display:none;"
  >

    <!-- NAVBAR -->

    <nav class="navbar">

      <div class="logo">
        Distribuídos OS
      </div>

      <ul class="nav-links">

        <li>

          <a
            href="#"
            onclick="alternarTela('tela-cadastro')"
          >
            Cadastrar Usuário
          </a>

        </li>

        <li>

          <a
            href="#"
            onclick="alternarTela('tela-listagem')"
          >
            Visualizar Banco
          </a>

        </li>

        <li>

          <a
            href="#"
            onclick="logout()"
          >
            Sair
          </a>

        </li>

      </ul>

    </nav>


    <!-- CONTEÚDO -->

    <div class="container">


      <!-- CADASTRO DE USUÁRIOS -->

      <section
        id="tela-cadastro"
        class="modulo-tela"
      >

        <h2>
          👤 Cadastro de Usuário
        </h2>

        <form id="formCadastro">

          <div class="form-group">

            <label>
              Nome Completo:
            </label>

            <input
              type="text"
              id="nome"
              required
              placeholder="Digite o nome"
            />

          </div>

          <div class="form-group">

            <label>
              E-mail:
            </label>

            <input
              type="email"
              id="email"
              required
              placeholder="Digite o e-mail"
            />

          </div>

          <button
            type="submit"
            class="btn"
          >
            Enviar para a Rede
          </button>

        </form>

      </section>


      <!-- LISTAGEM -->

      <section
        id="tela-listagem"
        class="modulo-tela deactive"
      >

        <h2>
          🗄️ Dados Persistidos
        </h2>

        <button
          id="btnAtualizar"
          class="btn secundario"
        >
          Atualizar Lista
        </button>

        <table id="tabelaUsuarios">

          <thead>

            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Data Registro</th>
            </tr>

          </thead>

          <tbody></tbody>

        </table>

      </section>

    </div>

  </div>


  <!-- SCRIPT -->

  <script src="script.js"></script>

</body>

</html>
